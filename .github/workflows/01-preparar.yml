name: 1 - Preparar capítulo
on:
  workflow_dispatch:
    inputs:
      capitulo:
        description: Número do capítulo (exemplo 1)
        required: true
        type: string
      link:
        description: Link da mensagem do Telegram com o vídeo
        required: true
        type: string
permissions:
  contents: read
jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Baixar, transcrever e converter para 1280 x 960
        env:
          CAPITULO: ${{ inputs.capitulo }}
          LINK: ${{ inputs.link }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python pipeline.py preparar --capitulo "$CAPITULO" --link "$LINK"
      - name: Transcrição para enviar ao ChatGPT
        uses: actions/upload-artifact@v4
        with:
          name: transcricao-capitulo-${{ inputs.capitulo }}
          path: saida/capitulo_${{ inputs.capitulo }}/revisao/
          if-no-files-found: error
          retention-days: 14
      - name: Guardar vídeo convertido e plano de cortes
        uses: actions/upload-artifact@v4
        with:
          name: preparacao-capitulo-${{ inputs.capitulo }}
          path: trabalho/capitulo_${{ inputs.capitulo }}/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Instrução para a próxima etapa
        env:
          CAPITULO: ${{ inputs.capitulo }}
        run: |
          python - <<'PY'
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f"## Preparação concluída\nExecução: **{os.environ['GITHUB_RUN_ID']}**.\n\nBaixe o artefato de transcrição e envie transcricao_por_cena.json ao ChatGPT. Guarde o número desta execução para a finalização. Os arquivos ficam disponíveis por 14 dias.\n")
          PY
