name: 3 - Baixar cenas prontas
on:
  workflow_dispatch:
    inputs:
      capitulo:
        description: Número do capítulo (exemplo 52)
        required: true
        type: string
      execucao_finalizacao:
        description: Número da execução que gerou TODOS os vídeos
        required: true
        type: string
      cenas:
        description: 'Intervalo para baixar: 1-10, 11-30, 1,3,5 ou todas'
        required: true
        default: '1-10'
        type: string
permissions:
  contents: read
  actions: read
jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar capítulo e execução
        env:
          CAPITULO: ${{ inputs.capitulo }}
          EXECUCAO: ${{ inputs.execucao_finalizacao }}
        run: |
          python - <<'PY'
          import os, re
          for name in ('CAPITULO', 'EXECUCAO'):
              if not re.fullmatch(r'[1-9]\d*', os.environ[name]):
                  raise ValueError(f'{name}: informe apenas um número positivo.')
          PY
      - name: Recuperar os vídeos já finalizados
        uses: actions/download-artifact@v5
        with:
          name: videos-capitulo-${{ inputs.capitulo }}
          path: prontos/
          run-id: ${{ inputs.execucao_finalizacao }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Separar MP4 e TXT escolhidos sem renderizar
        env:
          CAPITULO: ${{ inputs.capitulo }}
          CENAS: ${{ inputs.cenas }}
        run: |
          python - <<'PY'
          import json, os, re, shutil
          from pathlib import Path
          chapter = 'capitulo_' + os.environ['CAPITULO']
          source = Path('prontos') / chapter
          destination = Path('selecionados') / chapter
          pairs = {}
          for video in source.glob('cena_*_final.mp4'):
              match = re.fullmatch(r'cena_(\d+)_final\.mp4', video.name)
              if match:
                  pairs[int(match[1])] = video
          if not pairs:
              raise ValueError('Nenhum vídeo encontrado neste capítulo. Confira a execução de FINALIZAÇÃO.')
          spec = os.environ['CENAS'].strip().lower()
          selected = set()
          if spec == 'todas':
              selected = set(pairs)
          else:
              for part in spec.split(','):
                  if not re.fullmatch(r'\s*\d+(\s*-\s*\d+)?\s*', part):
                      raise ValueError('Use 1-10, 11-30, 1,3,5 ou todas.')
                  bounds = [int(n) for n in part.split('-')]
                  start, end = bounds[0], bounds[-1]
                  if not 1 <= start <= end <= max(pairs):
                      raise ValueError(f'Intervalo inválido: {part}. Maior cena disponível: {max(pairs)}.')
                  selected.update(range(start, end + 1))
          missing = sorted(selected - set(pairs))
          if missing:
              raise ValueError(f'Cenas não disponíveis nessa finalização: {missing}. Use a execução que gerou todas as cenas.')
          for number in sorted(selected):
              caption = pairs[number].with_suffix('.txt')
              if not caption.is_file():
                  raise ValueError(f'Falta a legenda TXT da cena {number}.')
          destination.mkdir(parents=True, exist_ok=True)
          for number in sorted(selected):
              video = pairs[number]
              for file in (video, video.with_suffix('.txt')):
                  shutil.copy2(file, destination / file.name)
          (destination / 'cenas_selecionadas.json').write_text(
              json.dumps({'capitulo': int(os.environ['CAPITULO']), 'cenas': sorted(selected)}, indent=2),
              encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'## Download pronto\n\nCapítulo: {os.environ["CAPITULO"]}\n\nCenas: {", ".join(map(str, sorted(selected)))}\n\nBaixe o ZIP em Artifacts. Cada cena acompanha MP4 e TXT. Nenhum vídeo foi renderizado novamente.\n')
          PY
      - name: Disponibilizar o grupo escolhido para download
        uses: actions/upload-artifact@v4
        with:
          name: download-capitulo-${{ inputs.capitulo }}-${{ github.run_id }}
          path: selecionados/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
